name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  id-token: write


jobs:

  # ==========================================
  # Backend tests
  # ==========================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: sales_db
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: admin_password

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U app_admin -d sales_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ai_reader:reader_password@localhost:5433/sales_db

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt


      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client


      - name: Initialize test database
        env:
          PGPASSWORD: admin_password
        run: |
          psql \
            -h localhost \
            -p 5433 \
            -U app_admin \
            -d sales_db \
            -f database/init.sql


      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -v


  # ==========================================
  # Frontend
  # ==========================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint


      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # ==========================================
  # Docker
  # ==========================================

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Build backend image
        run: |
          docker build \
            -t ai-sql-agent-backend:ci \
            ./backend


      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t ai-sql-agent-frontend:ci \
            ./frontend


      - name: Validate Docker Compose
        run: |
          cp backend/.env.example backend/.env
          docker compose config



# ==========================================
# Deployment
# ==========================================

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      RESOURCE_GROUP: rg-ai-sql-agent
      ACR_NAME: yousefaisqlacr
      ACR_LOGIN_SERVER: yousefaisqlacr.azurecr.io

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"


      - name: Build backend image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/ai-sql-backend:${GITHUB_SHA}" \
            ./backend


      - name: Push backend image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/ai-sql-backend:${GITHUB_SHA}"


      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t "$ACR_LOGIN_SERVER/ai-sql-frontend:${GITHUB_SHA}" \
            ./frontend


      - name: Push frontend image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/ai-sql-frontend:${GITHUB_SHA}"


      - name: Deploy backend
        run: |
          az containerapp update \
            --name backend \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/ai-sql-backend:${GITHUB_SHA}"


      - name: Deploy frontend
        run: |
          az containerapp update \
            --name frontend \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/ai-sql-frontend:${GITHUB_SHA}"


      - name: Get frontend URL
        id: frontend
        run: |
          FQDN=$(az containerapp show \
            --name frontend \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"


      - name: Smoke test deployment
        run: |
          curl \
            --fail \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            "https://${{ steps.frontend.outputs.fqdn }}/api/health"