services:

  # ==========================================
  # PostgreSQL
  # ==========================================

  db:
    image: postgres:16-alpine

    container_name: ai_sql_postgres

    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: admin_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U app_admin -d sales_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ==========================================
  # FastAPI
  # ==========================================

  backend:
    build:
      context: ./backend

    container_name: ai_sql_backend

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg://ai_reader:reader_password@db:5432/sales_db

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================
  # React + Nginx
  # ==========================================

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api

    container_name: ai_sql_frontend

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data: